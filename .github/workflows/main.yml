name: Ruby

on:
  push:
    branches:
      - main

  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: Tests / Ruby ${{ matrix.ruby-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby-version: ["3.3", "3.4", "4.0"]

    steps:
      - uses: actions/checkout@v6
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true
      - name: Cache Rails fixture
        if: matrix.ruby-version == '4.0'
        uses: actions/cache@v4
        with:
          path: vendor/rails
          key: ${{ runner.os }}-rails-v1-${{ hashFiles('Rakefile') }}
      - name: Prepare Rails fixture
        if: matrix.ruby-version == '4.0'
        run: bundle exec rake vendor:setup:rails
      - name: Run tests
        run: bundle exec rake test

  quality:
    name: Quality and generated docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - name: Standard Ruby
        run: bundle exec standardrb
      - name: Reek
        run: bundle exec rake reek
      - name: Lint markdown ERB templates
        run: bundle exec rake erb:lint
      - name: YARD Lint
        run: bundle exec yard-lint lib/
      - name: Cache documentation fixtures
        uses: actions/cache@v4
        with:
          path: |
            vendor/jekyll-seo-tag
            vendor/minitest
            vendor/rails
            vendor/reverse_markdown
          key: ${{ runner.os }}-docs-v1-${{ hashFiles('Rakefile') }}
      - name: Validate markdown output (GFM)
        run: bundle exec rake markdown:validate
