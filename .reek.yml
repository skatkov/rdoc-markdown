---
detectors:
  Attribute:
    exclude:
      - RDoc::Options#markdown_unknown_tags
  BooleanParameter:
    exclude:
      - RDoc::Generator::Markdown::CrossrefExtension#link
  ControlParameter:
    exclude:
      - RDoc::Generator::Markdown::Descriptions#method_link
  DuplicateMethodCall:
    max_calls: 2
  FeatureEnvy:
    exclude:
      - RDoc::Generator::Markdown::Descriptions#method_link
  LongParameterList:
    exclude:
      - RDoc::Generator::Markdown::CrossrefExtension#link
  TooManyStatements:
    max_statements: 10
